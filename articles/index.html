<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles | Pranshu Chaurasia</title>
    <meta name="description"
        content="Writing and articles by Pranshu Chaurasia.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- Shared Styles -->
    <link rel="stylesheet" href="../assets/css/styles.css">

    <!-- Page-Specific Styles -->
    <style>
        /* =============================================
           Articles Page - Coming Soon Layout
           ============================================= */

        .page-content {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 120px 24px 80px;
            text-align: center;
        }

        body {
            background:
                radial-gradient(circle at 88% 8%, rgba(120, 214, 189, 0.07), transparent 28rem),
                radial-gradient(circle at 4% 70%, rgba(255, 128, 93, 0.08), transparent 32rem),
                var(--bg-primary);
        }

        nav .container {
            min-height: 62px;
            background: rgba(18, 19, 22, 0.94);
            border-radius: 14px;
        }

        [data-theme="light"] nav .container {
            background: rgba(255, 250, 242, 0.94);
        }

        .logo {
            gap: 10px;
            font-family: 'IBM Plex Sans', sans-serif;
        }

        .logo-mark {
            display: grid;
            width: 42px;
            height: 42px;
            place-items: center;
            color: #17120f;
            background: linear-gradient(145deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 50%;
            box-shadow: 0 7px 18px rgba(255, 128, 93, 0.2);
        }

        .logo-mark img {
            width: 36px;
            height: 36px;
            display: block;
        }

        .nav-links a {
            padding: 9px 10px;
            border-radius: 8px;
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 0.78rem;
        }

        .coming-soon-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background: rgba(255, 128, 93, 0.08);
            border: 1px solid var(--border-strong);
            border-radius: 10px;
            font-size: 0.85rem;
            color: var(--accent-primary);
            margin-bottom: 24px;
            font-family: 'IBM Plex Mono', monospace;
            animation: fadeInUp 0.6s ease;
        }

        .coming-soon-badge .dot {
            width: 8px;
            height: 8px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: pulse 2s infinite;
            box-shadow: 0 0 10px var(--accent-primary);
        }

        .page-title {
            max-width: 720px;
            font-family: 'IBM Plex Serif', Georgia, serif;
            font-size: clamp(3.5rem, 8vw, 6.8rem);
            font-weight: 500;
            line-height: 0.95;
            letter-spacing: -0.06em;
            margin-bottom: 16px;
            animation: fadeInUp 0.6s ease 0.1s backwards;
        }

        .page-description {
            font-size: 1.1rem;
            color: var(--text-secondary);
            max-width: 500px;
            margin-bottom: 40px;
            animation: fadeInUp 0.6s ease 0.2s backwards;
        }

        .back-link {
            animation: fadeInUp 0.6s ease 0.3s backwards;
        }

        /* Footer */
        footer {
            padding: 40px 0;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }

        footer p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .logo-name {
                display: none;
            }

            .page-title {
                font-size: clamp(3.2rem, 17vw, 5rem);
            }
        }

        .page-title .gradient-text {
            background: linear-gradient(110deg, var(--text-primary), var(--accent-primary) 62%, var(--accent-secondary));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: none;
        }
    </style>
</head>

<body>
    <!-- Background Effects -->
    <div class="grid-background"></div>
    <div class="noise-overlay"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <!-- Navigation -->
    <nav>
        <div class="container">
            <a href="../index.html" class="logo"><span class="logo-mark" aria-hidden="true"><img
                        src="../assets/images/smith-chart-mark.svg" alt=""></span><span class="logo-name">Pranshu
                    Chaurasia</span></a>
            <ul class="nav-links" id="navLinks">
                <li><a href="../index.html#experience">Journey</a></li>
                <li><a href="../index.html#projects">Work</a></li>
                <li><a href="../index.html#publications">Research</a></li>
                <li><a href="../index.html#skills">Toolbox</a></li>
                <li><a href="index.html" class="active">Articles</a></li>
                <li><a href="../index.html#contact">Contact</a></li>
            </ul>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <!-- Sun icon (shown in light mode) -->
                <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5" />
                    <line x1="12" y1="1" x2="12" y2="3" />
                    <line x1="12" y1="21" x2="12" y2="23" />
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                    <line x1="1" y1="12" x2="3" y2="12" />
                    <line x1="21" y1="12" x2="23" y2="12" />
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                </svg>
                <!-- Moon icon (shown in dark mode) -->
                <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
                </svg>
            </button>
            <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="page-content">
        <div class="coming-soon-badge">
            <span class="dot"></span>Writing in progress
        </div>
        <h1 class="page-title">
            <span class="gradient-text">Articles</span>
        </h1>
        <p class="page-description">
            I am preparing the first set of articles. They will be published here.
        </p>
        <a href="../index.html" class="back-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5" />
                <path d="m12 19-7-7 7-7" />
            </svg>
            Back to Home
        </a>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>© 2026 Pranshu Chaurasia</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        // Theme toggle functionality
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;

        // Safe localStorage wrapper for browsers with privacy restrictions (Brave)
        const getTheme = () => { try { return localStorage.getItem('theme'); } catch (e) { return null; } };
        const setTheme = (val) => { try { localStorage.setItem('theme', val); } catch (e) { } };

        // Check for saved theme preference or default to dark
        const savedTheme = getTheme() || 'dark';
        if (savedTheme === 'light') {
            html.setAttribute('data-theme', 'light');
        }

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            if (newTheme === 'dark') html.removeAttribute('data-theme');
            else html.setAttribute('data-theme', 'light');
            setTheme(newTheme);
        });

        // Mobile menu toggle
        document.getElementById('mobileMenuBtn').addEventListener('click', () => {
            document.getElementById('navLinks').classList.toggle('active');
        });
    </script>
</body>

</html>
